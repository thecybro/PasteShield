<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasteShield</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h1>PasteShield</h1>
      <span class="version">v0.1.0</span>
    </div>

    <div class="status">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>Protection Active</span>
      </div>
    </div>

    <div class="info-section">
      <h2>What's Protected</h2>
      <ul class="protection-list">
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Passwords
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          API Keys & Tokens
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Email Addresses
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Phone Numbers
        </li>
      </ul>
    </div>

    <div class="trusted-section">
      <div class="trusted-header">
        <h2>Trusted Sites</h2>
        <span id="trusted-count" class="badge">0</span>
      </div>
      <div id="trusted-list" class="trusted-list">
        <p class="empty-state">No trusted sites yet</p>
      </div>
      <button id="clear-btn" class="btn btn-danger" disabled>Clear Trusted Sites</button>
    </div>

    <div class="footer">
      <p>No data leaves your browser</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
