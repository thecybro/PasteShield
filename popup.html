<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasteShield</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h1>PasteShield</h1>
      <span class="version">v0.1.0</span>
    </div>

    <div class="status">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>Protection Active</span>
      </div>
    </div>

    <div class="stats-section">
      <div class="stat-card">
        <div class="stat-icon">🛡️</div>
        <div class="stat-info">
          <div class="stat-number" id="paste-count">0</div>
          <div class="stat-label">Blocked Today</div>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h2>Protection Settings</h2>
      <p class="settings-hint">Choose what to protect</p>

      <div class="toggle-list">
        <label class="toggle-item">
          <div class="toggle-info">
            <span class="toggle-icon">🔑</span>
            <span class="toggle-label">API Keys & Tokens</span>
          </div>
          <input type="checkbox" id="toggle-apiKeys" class="toggle-checkbox">
          <span class="toggle-switch"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <span class="toggle-icon">💳</span>
            <span class="toggle-label">Credit Cards</span>
          </div>
          <input type="checkbox" id="toggle-creditCards" class="toggle-checkbox">
          <span class="toggle-switch"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <span class="toggle-icon">🔐</span>
            <span class="toggle-label">Passwords</span>
          </div>
          <input type="checkbox" id="toggle-passwords" class="toggle-checkbox">
          <span class="toggle-switch"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <span class="toggle-icon">📱</span>
            <span class="toggle-label">Phone Numbers</span>
          </div>
          <input type="checkbox" id="toggle-phoneNumbers" class="toggle-checkbox">
          <span class="toggle-switch"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <span class="toggle-icon">📧</span>
            <span class="toggle-label">Email Addresses</span>
          </div>
          <input type="checkbox" id="toggle-emails" class="toggle-checkbox">
          <span class="toggle-switch"></span>
        </label>

      </div>
    </div>

    <div class="trusted-section">
      <div class="trusted-header">
        <h2>Trusted Sites</h2>
        <span id="trusted-count" class="badge">0</span>
      </div>
      <div id="trusted-list" class="trusted-list">
        <p class="empty-state">No trusted sites yet</p>
      </div>
      <button id="clear-btn" class="btn btn-danger" disabled>Clear Trusted Sites</button>
    </div>

    <div class="footer">
      <p>No data leaves your browser</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
